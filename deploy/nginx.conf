# Serves a Vue SPA + reverse-proxies /api to the Node service.
# Runs on 8080 to match the unprivileged nginx image (non-root).
# Upstream hostname `api` works in both Docker Compose and the K8s `api` Service
# in the same namespace.
#
# NOTE on add_header inheritance: nginx drops all inherited `add_header` directives
# as soon as a location defines its own. Each location below therefore repeats the
# security headers so they are present on every response (HTML, assets and health).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reusable security headers (duplicated per location due to nginx inheritance rules).
    # X-Content-Type-Options / X-Frame-Options / Referrer-Policy / X-XSS-Protection.

    # Health endpoint for Docker HEALTHCHECK and K8s probes.
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "ok\n";
    }

    # Reverse proxy API calls. The /api prefix is preserved so upstream routes
    # (e.g. /api/users) stay unchanged. Keep the URI exactly as requested.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Hashed assets (/assets/*) can be cached immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri =404;
    }

    # index.html must never be cached so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # SPA history fallback: unknown paths return index.html for client routing.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
