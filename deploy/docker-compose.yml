# Local production-like preview of the built image.
# Build from the repository root: docker compose -f deploy/docker-compose.yml up --build
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
