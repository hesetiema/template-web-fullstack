# Kustomize base. Argo CD watches this directory; CD patches `images.newTag`.
# Keeping the kustomization inside k8s/ ensures all referenced resources are local.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

images:
  - name: ghcr.io/your-org/template-web
    newName: ghcr.io/your-org/template-web
    newTag: "0.0.0"
