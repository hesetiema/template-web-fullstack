name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  # Never cancel an in-flight deploy midway.
  cancel-in-progress: false

env:
  HUSKY: 0
  CI: true
  REGISTRY: ghcr.io
  # GHCR image refs: ghcr.io/<owner>/<repo> and ghcr.io/<owner>/<repo>-api
  WEB_IMAGE: ${{ github.repository }}
  API_IMAGE: ${{ github.repository }}-api

permissions:
  contents: write      # needed to commit the image tag back for GitOps
  packages: write      # needed to push to GHCR

jobs:
  build-and-publish:
    name: Build & publish web + api images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable tag
        id: vars
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Update GitOps image tags
        env:
          SHORT_SHA: ${{ steps.vars.outputs.sha }}
        working-directory: k8s
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Both images are pushed with the same short-SHA tag above, so a single
          # replacement updates every newTag in kustomization.yaml consistently.
          # (Use `kustomize edit set image` locally if you prefer; sed keeps CI dependency-free.)
          sed -i -E "s#(newTag: ).*#\1\"${SHORT_SHA}\"#" kustomization.yaml

          git add kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest change; nothing to commit."
          else
            git commit -m "chore(ci): deploy ${SHORT_SHA} [skip ci]"
            git push
          fi
