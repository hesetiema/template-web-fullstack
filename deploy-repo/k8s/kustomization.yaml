# Kustomize base. Argo CD watches this directory; CD patches both image tags.
# Keeping the kustomization inside k8s/ ensures all referenced resources are local.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - api-configmap.yaml
  - api-secret.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml

images:
  - name: gitea.meos.center/your-org/template-web-fullstack
    newName: gitea.meos.center/your-org/template-web-fullstack
    newTag: "0.0.0"
  - name: gitea.meos.center/your-org/template-web-fullstack-api
    newName: gitea.meos.center/your-org/template-web-fullstack-api
    newTag: "0.0.0"
