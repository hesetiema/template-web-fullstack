apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: template-web
  labels:
    app: api
spec:
  # Port 3000 matches nginx.conf upstream `http://api:3000` in both K8s and Compose.
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
