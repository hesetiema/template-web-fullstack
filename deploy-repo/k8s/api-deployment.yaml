apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: template-web
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: template-web-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      # Run migrations to completion before any API pod starts.
      initContainers:
        - name: migrate
          image: gitea.meos.center/your-org/template-web-fullstack-api:0.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/migrate.js"]
          envFrom:
            - configMapRef:
                name: template-web-api-config
            - secretRef:
                name: template-web-api-secrets
          env:
            - name: MIGRATIONS_DIR
              value: /app/migrations
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: gitea.meos.center/your-org/template-web-fullstack-api:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Liveness must not depend on the DB (see /health in src/routes/health.ts).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          # Readiness does check the DB; a DB outage removes pods from Service endpoints
          # without triggering restarts.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: template-web-api-config
            - secretRef:
                name: template-web-api-secrets
          env:
            - name: MIGRATIONS_DIR
              value: /app/migrations
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
