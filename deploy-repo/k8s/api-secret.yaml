# PLACEHOLDER ONLY — do not commit real credentials.
# Raw K8s Secrets are base64-encoded, NOT encrypted. For production use
# Sealed Secrets, External Secrets Operator, or a cloud secret store, and
# remove this file from Git (add a kustomize overlay that injects the real one).
apiVersion: v1
kind: Secret
metadata:
  name: template-web-api-secrets
  namespace: template-web
type: Opaque
stringData:
  DATABASE_URL: "postgres://REPLACE_ME:REPLACE_ME@postgres:5432/template_web"
