apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: template-web
  namespace: template-web
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - web.example.com
      secretName: template-web-tls
  rules:
    - host: web.example.com
      http:
        paths:
          # API paths route directly to the API service. Exact /api first so that
          # the more specific rule wins over the SPA catch-all below.
          - path: /api
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: template-web
                port:
                  number: 80
