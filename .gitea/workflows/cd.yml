name: CD

# Builds web + api images, pushes them to this Gitea instance's container registry,
# then writes the short-SHA tag back to the SEPARATE deploy repository.
# Argo CD watches the deploy repo and syncs to the cluster — no kubectl in CI.
#
# Required repository secrets/variables (Settings → Actions → Secrets and variables):
#   GITEA_TOKEN      Personal Access Token (NOT the built-in job token — that one
#                    cannot push OCI images). Needs: write:repository + write:packages
#                    on BOTH the app repo and the deploy repo.
#   DEPLOY_REPO      full clone path of the deploy repo, e.g. your-org/template-web-fullstack-deploy
#                    (set it as a repository Variable, not a Secret)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  # Never cancel an in-flight deploy midway.
  cancel-in-progress: false

env:
  HUSKY: 0
  CI: true
  REGISTRY: gitea.meos.center

jobs:
  build-and-publish:
    name: Build · push images · update deploy repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gitea registry is host-scoped: gitea.meos.center/<owner>/<repo>.
      # gitea.repository already expands to "owner/repo" (lowercase not required).
      - name: Compute image refs and tag
        id: vars
        env:
          REPO: ${{ gitea.repository }}
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          echo "tag=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/${REPO}-api" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea container registry
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          echo "${GITEA_TOKEN}" | docker login "${REGISTRY}" -u "${{ gitea.actor }}" --password-stdin

      # Native docker build/push instead of build-push-action: portable across
      # Gitea runners and avoids GitHub-only `type=gha` cache backends.
      - name: Build and push web image
        env:
          WEB_IMAGE: ${{ steps.vars.outputs.web_image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -f ./deploy/Dockerfile -t "${WEB_IMAGE}:${TAG}" -t "${WEB_IMAGE}:latest" .
          docker push "${WEB_IMAGE}:${TAG}"
          docker push "${WEB_IMAGE}:latest"

      - name: Build and push api image
        env:
          API_IMAGE: ${{ steps.vars.outputs.api_image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -f ./deploy/Dockerfile.api -t "${API_IMAGE}:${TAG}" -t "${API_IMAGE}:latest" .
          docker push "${API_IMAGE}:${TAG}"
          docker push "${API_IMAGE}:latest"

      # GitOps hand-off: clone the deploy repo, patch both newTags, commit and push.
      # Argo CD detects the commit and syncs — CD never touches the cluster directly.
      - name: Update deploy repo image tags
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          DEPLOY_REPO: ${{ vars.DEPLOY_REPO }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_REPO}" ]; then
            echo "::error::DEPLOY_REPO variable is not set"; exit 1
          fi

          git config --global user.name "gitea-actions[bot]"
          git config --global user.email "gitea-actions[bot]@users.noreply.gitea.meos.center"

          CLONE_URL="https://${{ gitea.actor }}:${GITEA_TOKEN}@${REGISTRY}/${DEPLOY_REPO}.git"
          git clone --depth 1 "${CLONE_URL}" deploy-repo
          cd deploy-repo

          # Both images share the same short-SHA tag; one replacement updates all newTags.
          sed -i -E "s#(newTag: ).*#\1\"${TAG}\"#" k8s/kustomization.yaml

          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest change; nothing to commit."
          else
            git commit -m "chore(deploy): ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
