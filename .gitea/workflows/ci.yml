name: CI

# Gitea Actions workflow. Runs on an act_runner registered against this Gitea instance.
# Note: gitea.* context replaces github.*; workflow syntax is otherwise GitHub-compatible.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  CI: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Gitea's runner image may not ship pnpm; activate it via corepack (bundled with Node 22).
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Web unit tests
        run: pnpm --filter @template/web test:coverage

      - name: API unit tests
        run: pnpm --filter @template/api test:coverage

      - name: Build both apps
        run: pnpm build
